# Kikundi Bora — one-off migration override.
#
# WHY THIS FILE EXISTS (defense in depth for one-off migrate runs):
# the base stack sets `restart: unless-stopped` on the backend service.
# One-off migration containers must never be restarted by the daemon, so
# this override pins `restart: "no"` for them.
#
# (The actual 20-minute deploy hang had a different root cause: the old
# command spelled out the binary path — `run --rm backend /app/kikundi-api
# -migrate` — but the image already has exec-form ENTRYPOINT
# ["/app/kikundi-api"], so compose built argv
# "/app/kikundi-api /app/kikundi-api -migrate" and Go's flag.Parse stopped
# at the first non-flag arg: -migrate was never set, the one-off booted the
# full server, and the step never returned. Fixed in deploy.yml by passing
# ONLY the flag. This file stays as cheap insurance.)
#
# Include this file ONLY for one-off migrate/ledger invocations:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.migrate.yml run --rm backend -migrate
#
# Normal `up` (app + db) must NOT include this file.

services:
  backend:
    restart: "no"
