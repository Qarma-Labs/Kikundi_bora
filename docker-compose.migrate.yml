# Kikundi Bora — one-off migration override.
#
# WHY THIS FILE EXISTS (deploy hang root-cause fix):
# the base stack sets `restart: unless-stopped` on the backend service.
# A plain `docker compose run --rm backend /app/kikundi-api -migrate`
# inherits that policy, so when the migrate process exits 0 the daemon
# restarts the one-off container with the same command — migrate runs
# again, exits, restarts, forever. The SSH deploy step then hangs until
# its command_timeout kills it (20 wasted minutes), even though the Go
# code itself exits correctly.
#
# Include this file ONLY for one-off migrate/ledger invocations so the
# container is never restarted:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.migrate.yml run --rm backend /app/kikundi-api -migrate
#
# Normal `up` (app + db) must NOT include this file.

services:
  backend:
    restart: "no"
