# Kikundi Bora — production override for the VPS behind the host Nginx
# reverse proxy (kikundi-test.ditronics.co.tz).
#
# Usage on the server (never plain `docker compose up` in production):
#   export TAG=<git-sha> GHCR_OWNER=<github-owner-lowercase>
#   export POSTGRES_PASSWORD="$(sed -n 's/^DB_PASSWORD=//p' backend/.env | head -n 1)"
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   docker exec kikundi-backend /app/kikundi-api -migrate
#
# What this override changes vs the local dev stack:
#   1. Uses the prebuilt GHCR images (nothing is built on the server).
#      Requires TAG and GHCR_OWNER in the environment (the deploy workflow
#      exports both; GHCR names must be lowercase).
#   2. Binds the app ports to 127.0.0.1 so the ONLY way in from outside is
#      through the host Nginx reverse proxy (public 80/443 -> 127.0.0.1:5051
#      for the SPA, and /api/* -> 127.0.0.1:5050 for the API). The backend is
#      never directly reachable from the internet, and no separate backend
#      subdomain/port is exposed. NOTE: update the host Nginx proxy_pass
#      targets together with this change (see docs/deploy/nginx-site.conf).
#   3. Rebinds db host publishing to 127.0.0.1:${DB_HOST_PORT:-15432} to avoid
#      collisions with host-level postgres on 5432 during deploy.
#   4. Leaves everything else (db, volumes, networks, env_file, healthchecks)
#      exactly as in docker-compose.yml.

services:
  backend:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER must be set (lowercase github owner)}/kikundibora-backend:${TAG:-latest}
    # Production identity (base compose defaults to development):
    #  - Sentry events tag env=production (not development)
    #  - Seed skips demo users (demo123 must never exist in production)
    #  - Production-only hardening (e.g. HSTS) engages
    environment:
      ENVIRONMENT: "production"
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-5050}:8080"

  frontend:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER must be set (lowercase github owner)}/kikundibora-frontend:${TAG:-latest}
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-5051}:8080"

  db:
    # Keep Postgres host-bound for maintenance access, but on a non-default
    # port so deploy does not fail when the host already runs postgres on 5432.
    ports: !override
      - "127.0.0.1:${DB_HOST_PORT:-15432}:5432"
