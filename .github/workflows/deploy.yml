# Kikundibora — build & deploy to the Contabo VPS on push to main.
#
# Reality this matches (verified against the repo, not assumed):
#   - TWO images, not one:  backend/Dockerfile  (Go API, :8080 internal)
#                           Frontend-1/Dockerfile (nginx SPA, internal :8080)
#   - Host-published ports (127.0.0.1): backend 5050, frontend 5051
#   - THREE compose services: backend + frontend + db (postgres).
#   - The frontend bakes VITE_API_URL at BUILD time, so the production image
#     must be built with VITE_API_URL=https://<public-host>/api/v1, otherwise
#     visitors' browsers would call their own localhost and every API call
#     would fail. The host Nginx (managed separately) proxies /api/* to the
#     backend, which is bound to 127.0.0.1 (see docker-compose.prod.yml) and
#     therefore never directly reachable from the internet.
#
# Required GitHub repo secrets (already configured):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT, VPS_DEPLOY_PATH
# No extra secret is needed for GHCR: Job 1 pushes with the automatic
# GITHUB_TOKEN, and Job 2 reuses that same still-valid token to let the VPS
# pull (passed through the SSH session environment — never written to disk).
#
# First-ever run note: pushing creates the GHCR packages
# (kikundibora-backend / kikundibora-frontend). If the repo is private, set
# each package to the visibility you want under
# https://github.com/users/<owner>/packages after the first push.

name: Build & Deploy to VPS

on:
  push:
    branches: [main]

env:
  PUBLIC_HOST: kikundi-test.ditronics.co.tz
  IMAGE_BACKEND: kikundibora-backend
  IMAGE_FRONTEND: kikundibora-frontend

jobs:
  # ------------------------------------------------------------------
  # Job 1: build both images on GitHub, push :sha + :latest to GHCR.
  # ------------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase owner for GHCR (registry names must be lowercase)
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_BACKEND }}:latest

      - name: Build and push frontend image (production API URL baked in)
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend-1
          file: ./Frontend-1/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://${{ env.PUBLIC_HOST }}/api/v1
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_FRONTEND }}:latest

#   deploy:
#     needs: build-and-push
#   Job 2: pull on the VPS, backup, migrate with the new image, THEN restart
#   (same manual process as setup.sh, automated:
#   pull -> backup -> migrate -> up -> health-check).
#   NOTE: git pull on the VPS is retried with backoff (it once failed with
#   "Failed to connect to github.com port 443" — flaky VPS egress), and the
#   compose files are always scp'd fresh from the checkout so a deploy never
#   depends on the VPS being able to reach github.com.
# ------------------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ship compose files to the VPS (never rely on git pull from the VPS)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-compose.yml,docker-compose.prod.yml,docs/deploy/nginx-site.conf"
          target: ${{ secrets.VPS_DEPLOY_PATH }}
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          TAG: ${{ github.sha }}
          GHCR_OWNER: ${{ github.repository_owner }}
          PUBLIC_HOST: ${{ env.PUBLIC_HOST }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: GHCR_TOKEN,GHCR_ACTOR,TAG,GHCR_OWNER,PUBLIC_HOST
          command_timeout: 20m
          script: |
              set -euo pipefail
              cd "${{ secrets.VPS_DEPLOY_PATH }}"

              echo "==> 1/10 git pull (compose files are scp'd separately — this is best-effort)"
              # The scp step above overwrites these exact paths, so reset any
              # local edits + the untracked template copy first — otherwise
              # the merge aborts ("would be overwritten by merge").
              git checkout -- docker-compose.yml docker-compose.prod.yml 2>/dev/null || true
              rm -f docs/deploy/nginx-site.conf
              # VPS egress to github.com can be flaky (once timed out after 133s);
              # retry with backoff but never fail the deploy over it — the compose
              # files were just scp'd fresh by the workflow above.
              PULL_OK=0
              for i in 1 2 3 4 5; do
                if git pull --ff-only; then PULL_OK=1; break; fi
                echo "git pull attempt $i failed; retrying in 15s..."
                sleep 15
              done
              if [ "${PULL_OK:-0}" != "1" ]; then
                echo "WARN: git pull unreachable from the VPS — continuing with the scp'd compose files."
                echo "      (check VPS egress to github.com: curl -4 -m 10 -v https://github.com -o /dev/null)"
              fi

              # GHCR names must be lowercase even if the GitHub owner is not.
              GHCR_OWNER="$(echo "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
              export TAG GHCR_OWNER

              echo "==> 2/10 docker login to GHCR (token lives only in this session)"
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

              echo "==> 3/10 wire db password (same rule as setup.sh: compose reads it from the host env, backend from backend/.env)"
              ENV_FILE="backend/.env"
              if [ ! -f "$ENV_FILE" ]; then
                echo "WARN: $ENV_FILE missing; rebuilding from backend/.env.example"
                cp backend/.env.example "$ENV_FILE"
                RECOVERED_DB_PASSWORD="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' kikundi-db 2>/dev/null | sed -n 's/^POSTGRES_PASSWORD=//p' | head -n 1 || true)"
                RECOVERED_JWT_SECRET="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' kikundi-backend 2>/dev/null | sed -n 's/^JWT_SECRET=//p' | head -n 1 || true)"
                RECOVERED_ADMIN_PASSWORD="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' kikundi-backend 2>/dev/null | sed -n 's/^ADMIN_PASSWORD=//p' | head -n 1 || true)"
                POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-$RECOVERED_DB_PASSWORD}"
                [ -n "$POSTGRES_PASSWORD" ] || POSTGRES_PASSWORD="$(openssl rand -hex 16)"
                JWT_SECRET="${RECOVERED_JWT_SECRET:-$(openssl rand -hex 32)}"
                ADMIN_PASSWORD="${RECOVERED_ADMIN_PASSWORD:-$(openssl rand -hex 16)}"
                sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=$POSTGRES_PASSWORD|" "$ENV_FILE"
                sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$JWT_SECRET|" "$ENV_FILE"
                sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=$ADMIN_PASSWORD|" "$ENV_FILE"
              fi
              POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-$(sed -n 's/^DB_PASSWORD=//p' "$ENV_FILE" | head -n 1)}"
              [ -n "$POSTGRES_PASSWORD" ] || { echo "ERROR: DB_PASSWORD empty in $ENV_FILE"; exit 1; }
              export POSTGRES_PASSWORD

              echo "==> 4/10 ensure public origin in backend CORS (browsers block the SPA otherwise)"
              PUBLIC_ORIGIN="https://$PUBLIC_HOST"
              CORS_CHANGED=0
              if grep -q '^CORS_ORIGINS=' "$ENV_FILE"; then
                if ! grep -q "$PUBLIC_ORIGIN" "$ENV_FILE"; then
                  sed -i "s|^CORS_ORIGINS=.*|&,${PUBLIC_ORIGIN}|" "$ENV_FILE"
                  CORS_CHANGED=1
                fi
              else
                printf '\nCORS_ORIGINS=%s\n' "$PUBLIC_ORIGIN" >> "$ENV_FILE"
                CORS_CHANGED=1
              fi
              # env_file changes do not trigger a recreate on their own, so
              # force one when we just edited backend/.env.
              RECREATE=""
              [ "$CORS_CHANGED" = "1" ] && RECREATE="--force-recreate"

              free_backend_port_5050() {
                CONFLICTING_5050_CONTAINERS="$(
                  docker ps -a --format '{{.ID}} {{.Ports}}' \
                    | awk '$0 ~ /(0\.0\.0\.0:5050->|127\.0\.0\.1:5050->|:::5050->)/ {print $1}' \
                    | sort -u \
                    || true
                )"
                if [ -n "$CONFLICTING_5050_CONTAINERS" ]; then
                  echo "$CONFLICTING_5050_CONTAINERS" | xargs -r docker rm -f
                fi
                for _ in $(seq 1 15); do
                  if ! ss -ltnH '( sport = :5050 )' | grep -q .; then
                    return 0
                  fi
                  sleep 1
                done
                return 1
              }

              echo "==> 5/10 free backend host port (docker-proxy collisions break deploy)"
              if ! free_backend_port_5050; then
                echo "ERROR: host port 127.0.0.1:5050 is still in use; cannot continue safely"
                ss -ltnH '( sport = :5050 )'
                exit 1
              fi

              echo "==> 6/10 pull new images (no restart yet — migrate runs first)"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

              echo "==> 7/10 backup BEFORE migrate (rollback = restore this file)"
              BACKUP_DIR="${{ secrets.VPS_DEPLOY_PATH }}/deploy-backups"
              mkdir -p "$BACKUP_DIR"
              if docker ps --format '{{.Names}}' | grep -qx kikundi-db; then
                BACKUP_FILE="$BACKUP_DIR/pre-migrate-${TAG}-$(date +%Y%m%d-%H%M%S).sql.gz"
                docker exec kikundi-db pg_dump -U kikundi kikundi_db | gzip > "$BACKUP_FILE"
                echo "backup written: $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1))"
                ls -t "$BACKUP_DIR"/pre-migrate-*.sql.gz | tail -n +6 | xargs -r rm -f
              else
                echo "no existing kikundi-db container — first deploy, nothing to back up."
              fi

              echo "==> 8/10 migrate with the NEW image BEFORE restart (one-off container)"
              echo "      (non-zero exit stops the deploy here — live containers keep running untouched)"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm backend /app/kikundi-api -migrate
              echo "migrate OK — applied versions now recorded:"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm backend /app/kikundi-api -migrations

              echo "==> 9/10 restart on the migrated schema (127.0.0.1-bound per docker-compose.prod.yml)"
              # up-with-retry: a stale docker-proxy from the container being
              # replaced can still hold 127.0.0.1:5050 for a few seconds after
              # the guard passed ("failed to bind ... address already in use").
              # Re-run the guard and retry instead of failing the deploy.
              UP_OK=0
              for i in 1 2 3; do
                free_backend_port_5050 || true
                # shellcheck disable=SC2086
                if docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d $RECREATE; then
                  UP_OK=1; break
                fi
                echo "compose up attempt $i failed (stale 5050 holder?); re-running guard and retrying in 10s..."
                sleep 10
              done
              if [ "$UP_OK" != "1" ]; then
                echo "ERROR: compose up failed 3x. Current 5050 holder:"
                ss -ltnp '( sport = :5050 )' 2>/dev/null || ss -ltn
                exit 1
              fi

              echo "==> 10/10 health checks (no second migrate — it already ran in 8/10)"
              curl -sf http://127.0.0.1:5050/health | grep -q '"status":"ok"'
              echo "backend OK"
              curl -sf http://127.0.0.1:5051/ > /dev/null
              echo "frontend OK"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

              echo "DEPLOY DONE — ${PUBLIC_HOST} serving sha ${TAG}
              REMINDER: the host Nginx must proxy the SPA to 127.0.0.1:5051 and
              /api/* to 127.0.0.1:5050 (see docs/deploy/nginx-site.conf)."
